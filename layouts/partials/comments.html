<script src="https://giscus.app/client.js"
  data-repo="palemoky/blog"
  data-repo-id="R_kgDOTEbl1Q"
  data-category="Announcements"
  data-category-id="DIC_kwDOTEbl1c4C_1oe"
  data-mapping="pathname"
  data-strict="0"
  data-reactions-enabled="1"
  data-emit-metadata="0"
  data-input-position="top"
  data-theme="preferred_color_scheme"
  data-lang="zh-CN"
  data-loading="lazy"
  crossorigin="anonymous"
  async>
</script>
<script>
  (() => {
    const light = '{{ .Site.Params.giscus.lightTheme | default "light" }}';
    const dark  = '{{ .Site.Params.giscus.darkTheme  | default "dark"  }}';
    const theme = () => document.documentElement.dataset.theme === 'dark' ? dark : light;

    const sync = () => document.querySelector('iframe.giscus-frame')
      ?.contentWindow.postMessage({ giscus: { setConfig: { theme: theme() } } }, 'https://giscus.app');

    // giscus 首次发消息说明 iframe 已就绪，立即同步一次
    window.addEventListener('message', function init(e) {
      if (e.origin !== 'https://giscus.app') return;
      sync();
      window.removeEventListener('message', init);
    });

    // PaperMod 切换主题时同步
    new MutationObserver(sync)
      .observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
  })();
</script>
