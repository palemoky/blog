baseURL = 'https://blog.palemoky.com/'
title = "Palemoky's Blog"
copyright = '© 2025 Palemoky'
paginate = 10
enableRobotsTXT = true
defaultContentLanguage = 'zh'
defaultContentLanguageInSubdir = false

[params]
  env = 'production'
  description = 'Palemoky 的个人博客，记录思考，分享所学'
  author = 'Palemoky'
  defaultTheme = 'auto'
  ShowReadingTime = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowWordCount = false
  ShowRssButtonInSectionTermList = true
  UseHugoToc = true
  showtoc = true
  tocopen = false
  comments = true
  hidemeta = false
  hideSummary = false

  [params.homeInfoParams]
    Title = '你好'
    Content = '欢迎来到我的博客，这里记录思考、分享所学。'

  [[params.socialIcons]]
    name = 'github'
    url = 'https://github.com/Palemoky'

  [params.assets]
    disableHLJS = true

[markup.highlight]
  noClasses = false
  anchorLineNos = false
  codeFences = true
  guessSyntax = true
  lineNos = true
  style = 'dracula'

[languages]
  [languages.zh]
    label = '中文'
    weight = 1
    [languages.zh.params]
      description = 'Palemoky 的个人博客，记录思考，分享所学'
  [languages.en]
    label = 'English'
    weight = 2
    [languages.en.params]
      description = "Palemoky's personal blog"

[menus]
  [[menus.main]]
    identifier = 'posts'
    name = '文章'
    url = '/posts/'
    weight = 1
  [[menus.main]]
    identifier = 'tags'
    name = '标签'
    url = '/tags/'
    weight = 2
  [[menus.main]]
    identifier = 'about'
    name = '关于'
    url = '/about/'
    weight = 3
  [[menus.main]]
    identifier = 'search'
    name = '搜索'
    url = '/search/'
    weight = 4

[outputs]
  home = ['html', 'rss', 'json']

[module]
  [[module.imports]]
    path = 'github.com/adityatelange/hugo-PaperMod'
