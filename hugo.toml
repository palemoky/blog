baseURL = 'https://blog.palemoky.com/'
title = "Palemoky's Blog"
copyright = '© 2024-2025 Palemoky'
enableRobotsTXT = true
defaultContentLanguage = 'zh'
defaultContentLanguageInSubdir = false

[params]
  description = 'Palemoky 的个人博客'
  keywords = ['blog', 'personal', 'writing']
  tagline = '记录思考，分享所学'
  footer = '由 <a href="https://github.com/sergeyklay/gohugo-theme-ed" target="_blank" rel="noopener noreferrer">Ed</a> 构建 &middot; <a href="https://github.com/Palemoky/blog" target="_blank" rel="noopener noreferrer">GitHub</a>'
  colorScheme = ''
  mainSections = ['posts']
  dateFormat = '2006-01-02'
  dateFormatToc = '2006.01.02'
  readmore = true
  feedSize = 25
  recentPostsSize = 5

  showAuthor = true
  [params.author]
    name = 'Palemoky'
    github = 'Palemoky'

  [params.search]
    maxSummaryLength = 100
    languages = ['en']

  [params.comments]
    enable = false

[languages]
  [languages.zh]
    locale = 'zh-CN'
    direction = 'ltr'
    label = '中文'
    weight = 1
    title = "Palemoky's Blog"
    [languages.zh.params]
      description = 'Palemoky 的个人博客，记录思考，分享所学'
  [languages.en]
    locale = 'en'
    direction = 'ltr'
    label = 'English'
    weight = 2
    title = "Palemoky's Blog"
    [languages.en.params]
      description = "Palemoky's personal blog"

[menus]
  [[menus.main]]
    identifier = 'home'
    name = '首页'
    pageRef = '/'
    weight = 1
  [[menus.main]]
    identifier = 'posts'
    name = '文章'
    pageRef = '/posts'
    weight = 2
  [[menus.main]]
    identifier = 'about'
    name = '关于'
    pageRef = '/about'
    weight = 3
  [[menus.main]]
    identifier = 'search'
    name = '搜索'
    pageRef = '/search'
    weight = 4

[pagination]
  pagerSize = 10

[taxonomies]
  tag = 'tags'
  category = 'categories'

[outputs]
  home = ['html', 'rss', 'manifest', 'atom', 'jsonfeed', 'json', 'humanstxt']
  page = ['html']
  rss = ['rss']
  section = ['html', 'rss', 'atom', 'jsonfeed']
  taxonomy = ['html', 'rss']
  term = ['html', 'rss']

[outputFormats]
  [outputFormats.atom]
    name = 'atom'
    mediaType = 'text/xml'
    baseName = 'atom'
    rel = 'alternate'
    isPlainText = false
    isHTML = false
    noUgly = true
  [outputFormats.jsonfeed]
    name = 'jsonfeed'
    mediaType = 'application/feed+json'
    baseName = 'feed'
    rel = 'alternate'
    isPlainText = true
    isHTML = false
    noUgly = false
  [outputFormats.manifest]
    name = 'manifest'
    mediaType = 'application/manifest+json'
    baseName = 'manifest'
    rel = 'manifest'
    isPlainText = true
    isHTML = false
    noUgly = false
    notAlternative = false
  [outputFormats.humanstxt]
    name = 'humanstxt'
    mediaType = 'text/plain'
    baseName = 'humans'
    rel = 'author'
    isPlainText = true
    isHTML = false
    noUgly = true
    notAlternative = true
  [outputFormats.rss]
    baseName = 'rss'
    mediaType = 'application/rss+xml'

[mediaTypes]
  [mediaTypes.'text/xml']
    suffixes = ['xml']
  [mediaTypes.'application/feed+json']
    suffixes = ['json']

[sitemap]
  changefreq = 'monthly'
  filename = 'sitemap.xml'
  priority = 0.5

[markup]
  defaultMarkdownHandler = 'goldmark'
  [markup.highlight]
    noClasses = false
  [markup.goldmark]
    [markup.goldmark.parser]
      [markup.goldmark.parser.attribute]
        block = true

[frontmatter]
  lastmod = ['lastmod', ':git', 'modified', 'date', 'publishdate', 'pubdate', 'published']

[module]
  [module.hugoVersion]
    extended = true
    min = '0.147.8'
  [[module.imports]]
    path = 'github.com/sergeyklay/gohugo-theme-ed'

[minify]
  disableXML = true
  [minify.tdewolff]
    [minify.tdewolff.html]
      keepQuotes = true

[build]
  [build.buildStats]
    disableClasses = false
    disableIDs = false
    disableTags = false
    enable = true
