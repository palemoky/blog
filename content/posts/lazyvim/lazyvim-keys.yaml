columns: [分类, 操作组, 按键, 作用]
sections:
- name: 文件与缓冲区
  groups:
  - name: 文件
    rows:
    - ['`<leader><space>` / `<leader>ff`', 在项目里模糊查找文件]
    - ['`<leader>fr`', 最近打开的文件]
    - ['`<leader>fn`', 新建文件]
    - ['`<C-s>`', 保存（Insert 模式下也能用）]
    - ['`<leader>e`', 打开 / 关闭左侧文件树]
    - ['`<leader>/`', 在整个项目里搜索文本]
  - name: 缓冲区
    rows:
    - ['`<leader>,`', 在已打开的缓冲区里搜索切换，列表里可用 `gg` / `G` 跳到首尾]
    - ['`<S-h>` / `<S-l>`', 上一个 / 下一个缓冲区]
    - ['`<leader>bb` / `` <leader>` ``', 在最近两个缓冲区之间来回切]
    - ['`:bf` / `:bl`', 跳到第一个 / 最后一个缓冲区]
    - ['`<leader>bd`', 关闭当前缓冲区]
- name: 窗口与标签页
  groups:
  - name: 分屏
    rows:
    - ['`<leader>-` / `<leader>ws`', 上下分屏]
    - ['`<leader>|` / `<leader>wv`', 左右分屏]
  - name: 切换与关闭
    rows:
    - ['`<C-h/j/k/l>`', 切换到左 / 下 / 上 / 右边的窗口]
    - ['`<leader>wd` / `<leader>wq`', 关闭当前窗口]
  - name: 标签页
    rows:
    - ['`<leader><tab><tab>`', 新建标签页]
    - ['`:tcd <目录>`', 给当前标签页单独设置工作目录，适合一个标签页开一个项目]
    - ['`gt` / `gT`', 下一个 / 上一个标签页]
    - ['`<leader><tab>d`', 关闭当前标签页]
  - name: 会话
    rows:
    - ['`<leader>qs`', 恢复上次在这个目录下打开的文件和窗口布局]
    - ['`<leader>qq`', 退出 Neovim]
- name: 编辑
  groups:
  - name: 注释
    rows:
    - ['`gcc`', 注释 / 取消注释当前行]
    - ['`gc`', 注释选中的内容（Visual 模式）]
    - ['`gcip`', 注释整段]
    - ['`gco` / `gcO`', 在下一行 / 上一行新增一行注释]
  - name: 按函数操作
    rows:
    - ['`vaf`', 选中整个函数]
    - ['`yaf` / `yif`', 复制整个函数 / 函数体]
    - ['`daf` / `dif`', 删除整个函数 / 函数体]
  - name: 成对符号
    rows:
    - ['`gsa`', 给选中内容加上一对符号，比如 `viwgsa"` 给单词加双引号]
    - ['`gsd`', 删除一对符号，比如 `gsd"`]
    - ['`gsr`', 替换一对符号，比如 `gsr'"` 把单引号换成双引号]
  - name: 剪贴板
    rows:
    - ['`y` / `p`', 直接和系统剪贴板互通，LazyVim 已默认开启]
    - ['`:%y`', 复制整个文件]
    - ['`"+y` / `"+p`', 通过 SSH 连到远程机器时，要显式指定 `+` 寄存器]
  - name: 其他
    rows:
    - ['`]<Space>` / `[<Space>`', 在下方 / 上方插入空行，不进入 Insert 模式]
    - ['`:<行号>`', 跳到指定行，比如 `:42`]
    - ['`gx`', 用浏览器打开光标处的链接]
- name: 折叠
  groups:
  - name: 当前位置
    rows:
    - ['`za`', 折叠 / 展开光标所在的块]
    - ['`zc` / `zo`', 折叠 / 展开]
    - ['`zC` / `zO`', 连同里面的层级一起折叠 / 展开]
  - name: 全部
    rows:
    - ['`zM` / `zR`', 折叠 / 展开全部]
    - ['`zm` / `zr`', 逐级折叠 / 展开]
    - ['`zj` / `zk`', 跳到下一个 / 上一个折叠处]
- name: 写代码
  groups:
  - name: 补全
    rows:
    - ['`<C-n>` / `<C-p>`', 下一个 / 上一个补全候选]
    - ['`<CR>`', 确认补全]
  - name: 查看
    rows:
    - ['`gd` / `<C-]>`', 跳到定义]
    - ['`gr`', 列出所有引用]
    - ['`K`', 查看悬浮文档]
    - ['`<leader>ss`', 列出当前文件的函数、类等符号]
  - name: 修改
    rows:
    - ['`<leader>ca`', 代码操作（自动修复、导入等）]
    - ['`<leader>cr`', 重命名变量]
    - ['`<leader>cf`', 格式化当前文件]
  - name: 诊断
    rows:
    - ['`]d` / `[d`', 下一个 / 上一个报错]
    - ['`<leader>cd`', 查看当前行的报错详情]
    - ['`<leader>xx`', 列出所有报错（Trouble）]
- name: Git
  groups:
  - name: 打开
    rows:
    - ['`<leader>gg`', 打开 Lazygit 浮窗]
    - ['`<leader>gb`', 查看当前行的提交记录]
  - name: Lazygit 里
    rows:
    - ['`<Space>`', 暂存 / 取消暂存当前文件]
    - ['`<CR>`', 进入文件，可以逐行暂存]
    - ['`<C-u>` / `<C-d>`', 右侧差异内容向上 / 向下翻页]
- name: 工具
  groups:
  - name: 跳转
    rows:
    - ['`s`', 输入字符后，按提示的标签跳到屏幕上任意位置（flash）]
    - ['`S`', 按语法结构选中代码块]
  - name: 终端与草稿
    rows:
    - ['`<C-/>`', 打开 / 隐藏浮动终端]
    - ['`<leader>.`', 打开草稿页（Scratch），随手记点东西，不用存成文件]
    - ['`<leader>S`', 列出所有草稿页，选中后按 `<C-x>` 删除]
  - name: 帮助
    rows:
    - ['`<leader>`（等待）', 按下后稍等，弹出 which-key 菜单，看可用按键]
    - ['`<leader>sk`', 搜索所有按键绑定]
    - ['`<leader>l`', 打开插件管理器 Lazy]
