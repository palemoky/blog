columns: [分类, 操作组, 按键, 作用]
sections:
- name: 文件与缓冲区
  groups:
  - name: 文件
    rows:
    - ['`<leader><space>`', 在项目里查找文件]
    - ['`<leader>fr`', 最近打开的文件]
    - ['`<leader>fn`', 新建文件]
    - ['`<C-s>`', 保存（Insert 模式下也能用）]
    - ['`<leader>e`', 打开 / 关闭文件树]
  - name: 缓冲区
    rows:
    - ['`<leader>,`', 切换缓冲区]
    - ['`<S-h>` / `<S-l>`', 上一个 / 下一个缓冲区]
    - ['`` <leader>` ``', 切回上一个缓冲区]
    - ['`<leader>bd`', 关闭当前缓冲区]
- name: 窗口
  groups:
  - name: 分屏
    rows:
    - ['`<leader>|`', 左右分屏]
    - ['`<leader>-`', 上下分屏]
  - name: 切换与关闭
    rows:
    - ['`<C-h/j/k/l>`', 切换到左 / 下 / 上 / 右边的窗口]
    - ['`<leader>wd`', 关闭当前窗口]
    - ['`<leader>qq`', 退出 Neovim]
- name: 搜索与跳转
  groups:
  - name: 搜索
    rows:
    - ['`<leader>/`', 在整个项目里搜索文本]
    - ['`<leader>ss`', 列出当前文件的函数、类等符号]
  - name: 跳转
    rows:
    - ['`s`', 输入字符后，按提示的标签跳到屏幕上任意位置（flash）]
    - ['`S`', 按语法结构选中代码块]
- name: 写代码（LSP）
  groups:
  - name: 查看
    rows:
    - ['`gd`', 跳到定义]
    - ['`gr`', 列出所有引用]
    - ['`K`', 查看文档]
  - name: 修改
    rows:
    - ['`<leader>ca`', 代码操作（自动修复、导入等）]
    - ['`<leader>cr`', 重命名变量]
    - ['`<leader>cf`', 格式化]
  - name: 诊断
    rows:
    - ['`]d` / `[d`', 下一个 / 上一个报错]
    - ['`<leader>cd`', 查看当前行的报错详情]
    - ['`<leader>xx`', 列出所有报错（Trouble）]
- name: 工具
  groups:
  - name: Git 与终端
    rows:
    - ['`<leader>gg`', 打开 Lazygit]
    - ['`<C-/>`', 打开 / 关闭终端]
  - name: 帮助
    rows:
    - ['`<leader>`（等待）', 按下后稍等，弹出 which-key 菜单，看可用按键]
    - ['`<leader>sk`', 搜索所有按键绑定]
    - ['`<leader>l`', 打开插件管理器 Lazy]
